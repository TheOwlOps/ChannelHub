<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <radialGradient id="bgGlowLogo" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0068FF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0B132B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#050811" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="zaloIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="45%" stop-color="#0068FF" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <linearGradient id="hubLetterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="squircleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="#060913" />
  <rect width="512" height="512" rx="128" fill="url(#bgGlowLogo)" stroke="#1E293B" stroke-width="2" />

  <!-- Center Squircle Icon -->
  <g transform="translate(106, 106)" filter="url(#squircleGlow)">
    <rect width="300" height="300" rx="72" fill="url(#zaloIconGrad)" />
    <!-- Zalo Z monogram with node connections -->
    <path d="M85 85 H215 L115 215 H215" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Connected AI Agent Node Dot -->
    <circle cx="215" cy="85" r="16" fill="#38EF7D" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="85" cy="215" r="12" fill="#00D2FF" stroke="#FFFFFF" stroke-width="3" />
  </g>
</svg>
